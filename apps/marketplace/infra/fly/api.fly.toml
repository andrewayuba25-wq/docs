# Sample Fly.io config for the API service. Run `fly launch --copy-config`
# from `apps/marketplace/apps/api` to bootstrap.
app = 'artisan-api'
primary_region = 'jnb'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '4000'
  NODE_ENV = 'production'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
